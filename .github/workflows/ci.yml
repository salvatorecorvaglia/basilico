name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: "--max-old-space-size=6144"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate version consistency
        run: python3 scripts/check_versions.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting (Biome)
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm run build

      - name: Audit npm dependencies
        run: pnpm audit --audit-level high

  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  rust-clippy-test:
    name: Rust Clippy & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: v1-ci-artifacts

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g; s|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source"
            fi
          done
          options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${options[@]}" update
          sudo apt-get "${options[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Clippy linting
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify Rust cache inputs and compiled artifacts
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --all-features --format-version 1 --manifest-path src-tauri/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          du -sh src-tauri/target | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$(find src-tauri/target -name '*.rlib' -print -quit)"

  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

  package-smoke:
    name: Installer smoke (${{ matrix.platform }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            updater-platform: darwin-aarch64
          - platform: 'macos-15'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
            updater-platform: darwin-x86_64
          - platform: 'ubuntu-22.04'
            target: ''
            args: ''
            updater-platform: linux-x86_64
          - platform: 'windows-latest'
            target: ''
            args: ''
            updater-platform: windows-x86_64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: ${{ matrix.target == 'aarch64-apple-darwin' && 60 || 40 }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: v2-release-artifacts
          key: release-${{ matrix.target || matrix.platform }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g; s|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source"
            fi
          done
          options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${options[@]}" update
          sudo apt-get "${options[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure installer signing
        shell: bash
        env:
          RELEASE_BUILD: ${{ inputs.release || false }}
        run: |
          if [[ "$RELEASE_BUILD" == true && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo 'Release installers require a version tag' >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            node -e 'const fs = require("node:fs"); const path = "src-tauri/tauri.conf.json"; const config = JSON.parse(fs.readFileSync(path)); config.bundle.createUpdaterArtifacts = false; delete config.plugins.updater; fs.writeFileSync(path, JSON.stringify(config, null, 2));'
          fi
      - name: Build installers without publishing
        id: installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
          retryAttempts: ${{ runner.os == 'macOS' && 3 || 0 }}
      - name: Stage and checksum the installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.installers.outputs.artifactPaths }}
          APP_VERSION: ${{ steps.installers.outputs.appVersion }}
          UPDATER_PLATFORM: ${{ matrix.updater-platform }}
          UPDATER_SIGNED: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { copyFileSync, existsSync, mkdirSync, readFileSync, statSync, writeFileSync } from 'node:fs';
          import { basename, join } from 'node:path';
          const platforms = ['darwin-aarch64', 'darwin-x86_64', 'linux-x86_64', 'windows-x86_64'];
          const sha256 = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const safeName = (name) =>
            typeof name === 'string' &&
            basename(name) === name &&
            !/[\\/]/.test(name) &&
            !['.', '..'].includes(name);
          const updaterFile = (platform, files) => {
            const suffixes = platform.startsWith('darwin')
              ? ['.app.tar.gz']
              : platform.startsWith('linux')
                ? ['.AppImage', '.AppImage.tar.gz']
                : ['.msi.zip', '.msi', '.nsis.zip', '.exe'];
            return suffixes.map((suffix) => files.find((file) => file.name.endsWith(suffix))).find(Boolean);
          };

          function stage({ paths, platform, version, commit, signed, output }) {
            if (!platforms.includes(platform) || !/^[a-f0-9]{40}$/.test(commit))
              throw new Error('Invalid build identity');
            mkdirSync(output, { recursive: true });
            const sources = new Set(
              paths.flatMap((path) => (existsSync(`${path}.sig`) ? [path, `${path}.sig`] : [path])),
            );
            const files = [];
            for (const source of sources) {
              if (!statSync(source).isFile()) continue;
              let name = basename(source);
              if (name.includes('.app.tar.gz')) {
                const arch = platform === 'darwin-aarch64' ? 'aarch64' : 'x86_64';
                name = name.replace('.app.tar.gz', `_${arch}.app.tar.gz`);
              }
              if (!safeName(name) || files.some((file) => file.name === name))
                throw new Error(`Duplicate or unsafe asset: ${name}`);
              copyFileSync(source, join(output, name));
              files.push({ name, sha256: sha256(join(output, name)) });
            }
            if (!files.length) throw new Error('No installer artifacts produced');
            const manifest = { platform, version, commit, signed, files };
            if (signed) {
              const updater = updaterFile(platform, files);
              if (!updater || !files.some((file) => file.name === `${updater.name}.sig`))
                throw new Error(`Missing signed updater for ${platform}`);
            }
            writeFileSync(
              join(output, `manifest-${platform}.json`),
              `${JSON.stringify(manifest, null, 2)}\n`,
            );
            return manifest;
          }

          stage({ paths: JSON.parse(process.env.ARTIFACT_PATHS), platform: process.env.UPDATER_PLATFORM, output: 'release-assets', version: process.env.APP_VERSION, commit: process.env.GITHUB_SHA, signed: process.env.UPDATER_SIGNED === 'true' });
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: tauri-${{ matrix.updater-platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Verify Rust cache inputs and compiled artifacts
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --all-features --format-version 1 --manifest-path src-tauri/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          du -sh src-tauri/target | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$(find src-tauri/target -name '*.rlib' -print -quit)"
