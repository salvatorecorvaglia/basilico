[package]
name = "basilico"
version = "1.0.0"
description = "Fast modern, and beautiful Git GUI client"
authors = ["Salvatore Corvaglia"]
edition = "2021"
license = "MIT"

[lib]
name = "basilico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Exposes `test_utils` (and Tauri's mock runtime) to the integration tests in
# `tests/`, which link against the library as an external crate and so cannot
# see `#[cfg(test)]` items. Never enabled for a release build.
test-utils = ["tauri/test"]

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.20", features = ["ssh", "https", "vendored-openssl"] }
notify = "8"
notify-debouncer-mini = "0.6"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[dev-dependencies]
# Self-dependency so `cargo test`/`cargo clippy --all-targets` turn on
# `test-utils` automatically, while a release build leaves it off.
basilico = { path = ".", features = ["test-utils"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
