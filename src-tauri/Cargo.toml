[package]
name = "basilico"
version = "1.2.0"
description = "Fast, modern and beautiful Git GUI client"
authors = ["Salvatore Corvaglia"]
edition = "2021"
license = "MIT"

[lib]
name = "basilico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[features]
# Exposes `test_utils` (and Tauri's mock runtime) to the integration tests in
# `tests/`, which link against the library as an external crate and so cannot
# see `#[cfg(test)]` items. Never enabled for a release build.
test-utils = ["tauri/test"]

[dependencies]
tauri = "2.12.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
# `createUpdaterArtifacts = true` uses native v2 installers; legacy ZIP support
# is unnecessary and pulls in zip 4, affected by RUSTSEC-2026-0367/0368/0369.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
git2 = { version = "0.21.0", features = ["ssh", "https", "vendored-openssl"] }
notify = "8"
notify-debouncer-mini = "0.7.0"
# `rt` for `spawn_blocking`, `macros` for `join!` — Tauri owns the runtime.
tokio = { version = "1.54.1", features = ["rt", "macros"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.28.0", features = ["v4"] }
dirs = "7.0.0"
sha1 = "0.11.0"
hmac = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
keyring = "4.2"

[dev-dependencies]
# Self-dependency so `cargo test`/`cargo clippy --all-targets` turn on
# `test-utils` automatically, while a release build leaves it off.
basilico = { path = ".", features = ["test-utils"] }
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
